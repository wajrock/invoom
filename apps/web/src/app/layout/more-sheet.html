<app-mobile-page label="Plus" (closed)="closed.emit()">
    <app-logo mobilePageTitle class="h-5" />
    @if (auth.account(); as me) {
        <div class="bg-card mb-3 flex items-center gap-3 rounded-xl border px-4 py-3">
            <app-avatar size="md" [name]="me.name || me.email" />
            <span class="min-w-0 flex-1">
                <span class="block truncate font-medium">{{ me.name || me.email }}</span>
                @if (me.name) {
                    <span class="text-muted-foreground block truncate text-sm">{{ me.email }}</span>
                }
            </span>
        </div>
    }
    <div class="grid gap-3">
        @for (group of groups; track $index) {
            <div class="grid gap-1.5">
                @if (group.label) {
                    <p class="text-muted-foreground px-1 text-xs font-medium tracking-wider uppercase">
                        {{ group.label }}
                    </p>
                }
                <ul class="bg-card divide-y overflow-hidden rounded-xl border">
                    @for (item of group.items; track item.path) {
                        <li>
                            <a
                                appReplaceUrl
                                [routerLink]="item.path"
                                class="active:bg-muted flex items-center gap-3 px-4 py-3.5"
                            >
                                <span class="bg-muted grid size-8 place-items-center rounded-lg"
                                    ><ng-icon [name]="item.icon"
                                /></span>
                                <span class="flex-1 font-medium">{{ item.label }}</span>
                                <ng-icon name="lucideChevronRight" class="text-muted-foreground" />
                            </a>
                        </li>
                    }
                </ul>
            </div>
        }
    </div>
    <ul class="bg-card mt-3 divide-y overflow-hidden rounded-xl border">
        <li>
            <button
                type="button"
                class="text-destructive active:bg-muted flex w-full items-center gap-3 px-4 py-3.5 text-left"
                (click)="logout.emit()"
            >
                <span class="bg-destructive/10 grid size-8 place-items-center rounded-lg"
                    ><ng-icon name="lucideLogOut"
                /></span>
                <span class="flex-1 font-medium">Se déconnecter</span>
            </button>
        </li>
    </ul>
</app-mobile-page>
