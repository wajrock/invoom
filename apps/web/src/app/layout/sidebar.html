<aside
    class="bg-sidebar text-sidebar-foreground border-sidebar-border fixed inset-y-3 left-3 z-40 hidden w-60 flex-col overflow-hidden rounded-2xl border shadow-sm md:flex"
>
    <div class="flex h-14 items-center justify-between pr-3 pl-5">
        <app-logo class="h-5" />
        <a
            hlmBtn
            variant="ghost"
            size="icon-sm"
            class="text-muted-foreground"
            [href]="repoUrl"
            target="_blank"
            rel="noopener"
            aria-label="Code source sur GitHub"
            title="Code source sur GitHub"
        >
            <svg viewBox="0 0 24 24" class="size-4" fill="currentColor" aria-hidden="true">
                <path [attr.d]="githubPath" />
            </svg>
        </a>
    </div>
    <nav class="flex flex-1 flex-col gap-4 overflow-y-auto px-2 py-2" aria-label="Navigation principale">
        @for (group of groups; track $index) {
            <div class="grid gap-0.5">
                @if (group.label) {
                    <p class="text-sidebar-foreground/50 px-3 pb-1 text-[11px] font-medium tracking-wider uppercase">
                        {{ group.label }}
                    </p>
                }
                @for (item of group.items; track item.path) {
                    <ng-container *ngTemplateOutlet="link; context: {$implicit: item}" />
                }
            </div>
        }
    </nav>
    <div class="border-sidebar-border grid gap-2 border-t p-2">
        <!-- Loaded after the first paint: its menu library would otherwise weigh on the initial bundle -->
        @defer (on idle) {
            <app-account-menu (logout)="logout.emit()" />
        } @placeholder {
            <div class="h-12"></div>
        }
    </div>
</aside>

<ng-template #link let-item>
    <a
        appReplaceUrl
        [routerLink]="item.path"
        routerLinkActive="bg-sidebar-accent text-sidebar-accent-foreground font-medium"
        [routerLinkActiveOptions]="{exact: item.path === '/'}"
        class="hover:bg-sidebar-accent/70 flex items-center gap-2.5 rounded-md px-3 py-2 text-sm transition-colors"
    >
        <ng-icon [name]="item.icon" class="text-base opacity-80" />
        {{ item.label }}
    </a>
</ng-template>
