@if (form(); as f) {
    <form (ngSubmit)="save()">
        <app-settings-section
            heading="Activité"
            description="Elle fixe les taux standards, l’abattement fiscal et le calendrier des déclarations."
        >
            <div class="settings-card grid gap-4 p-4 sm:grid-cols-2 sm:p-5">
                <div class="grid gap-2">
                    <label hlmLabel for="s-activity">Type d’activité</label>
                    <select class="select-native" id="s-activity" name="activity" [(ngModel)]="f.activity">
                        @for (d of defaults(); track d.activity) {
                            <option [value]="d.activity">{{ d.label }}</option>
                        }
                    </select>
                </div>
                <div class="grid gap-2">
                    <label hlmLabel for="s-start">Début d’activité</label>
                    <app-date-input inputId="s-start" name="activityStart" required [(ngModel)]="f.activityStart" />
                </div>
                <div class="flex items-center justify-between gap-3 border-t pt-4 sm:col-span-2">
                    <label hlmLabel for="s-cfe-ex">
                        <span class="grid gap-0.5">
                            CFE exonérée l’année de création
                            <span class="text-muted-foreground text-xs font-normal">
                                La première CFE est due l’année suivant le début d’activité.
                            </span>
                        </span>
                    </label>
                    <hlm-switch
                        inputId="s-cfe-ex"
                        [checked]="f.cfeExemptFirstYear"
                        (checkedChange)="f.cfeExemptFirstYear = $event"
                    />
                </div>
                <div class="flex items-center justify-between gap-3 border-t pt-4 sm:col-span-2">
                    <label hlmLabel for="s-auto">
                        <span class="grid gap-0.5">
                            Échéances automatiques
                            <span class="text-muted-foreground text-xs font-normal">
                                Ajoute à tes échéances les déclarations URSSAF, la CFE et l’impôt, calculés avec ces
                                paramètres.
                            </span>
                        </span>
                    </label>
                    <hlm-switch
                        inputId="s-auto"
                        [checked]="f.autoDeadlines"
                        (checkedChange)="f.autoDeadlines = $event"
                    />
                </div>
            </div>
        </app-settings-section>

        <app-settings-section
            heading="Taux de charges"
            description="Chaque encaissement est calculé avec les taux en vigueur à sa date : un nouveau taux ne modifie jamais les montants passés."
        >
            <p sectionAside class="text-muted-foreground mt-1 text-xs leading-relaxed">
                Taux à vérifier chaque année sur
                <a
                    class="text-foreground underline underline-offset-2"
                    href="https://www.autoentrepreneur.urssaf.fr"
                    target="_blank"
                    rel="noopener"
                    >autoentrepreneur.urssaf.fr</a
                >. Impôt, CFE, seuils et fréquence : ceux en vigueur au 31 décembre.
            </p>
            <div class="settings-card divide-y">
                @for (p of sortedPeriods(); track p.key; let last = $last) {
                    <div>
                        <button
                            type="button"
                            class="hover:bg-muted/40 flex w-full items-center gap-3 px-4 py-3.5 text-left transition-colors"
                            (click)="toggleOpen(p)"
                            [attr.aria-expanded]="openKey() === p.key"
                        >
                            <span
                                class="grid size-8 shrink-0 place-items-center rounded-lg"
                                [class]="
                                    p.key === currentKey()
                                        ? 'bg-primary/10 text-primary'
                                        : 'bg-muted text-muted-foreground'
                                "
                            >
                                <ng-icon name="lucideHistory" />
                            </span>
                            <div class="min-w-0 flex-1">
                                <p class="flex flex-wrap items-center gap-2 text-sm font-medium">
                                    {{ periodTitle(p, last) }}
                                    @if (p.key === currentKey()) {
                                        <span hlmBadge class="bg-success/12 text-success">En vigueur</span>
                                    } @else if (isFuture(p)) {
                                        <span hlmBadge variant="outline">À venir</span>
                                    }
                                </p>
                                <p class="text-muted-foreground mt-0.5 text-xs">{{ periodSummary(p) }}</p>
                            </div>
                            <ng-icon
                                name="lucideChevronDown"
                                class="text-muted-foreground shrink-0 transition-transform"
                                [class.rotate-180]="openKey() === p.key"
                            />
                        </button>

                        @if (openKey() === p.key) {
                            <div class="bg-muted/30 border-t">
                                <app-rate-period-editor
                                    [period]="p"
                                    [oldest]="last"
                                    [removable]="f.periods.length > 1"
                                    (applyDefaults)="applyDefaults(p)"
                                    (remove)="removePeriod(p)"
                                />
                            </div>
                        }
                    </div>
                }
                <button
                    type="button"
                    class="text-primary hover:bg-muted/40 flex w-full items-center gap-2 px-4 py-3 text-sm font-medium transition-colors"
                    (click)="addPeriod()"
                >
                    <ng-icon name="lucidePlus" /> Ajouter un changement de taux
                </button>
            </div>
        </app-settings-section>

        <div
            class="bg-background/85 sticky bottom-(--tabbar-h) z-20 -mx-4 mt-8 flex flex-wrap justify-end gap-2 border-t px-4 py-3 backdrop-blur-xl max-sm:*:flex-1 md:mx-0 md:rounded-xl md:border"
        >
            <button hlmBtn type="button" variant="outline" (click)="reset()">Annuler les modifications</button>
            <button hlmBtn type="submit" [disabled]="saving()">
                @if (saving()) {
                    <app-spinner />
                }
                Enregistrer
            </button>
        </div>
    </form>
} @else if (error()) {
    <p class="text-destructive text-sm">{{ error() }}</p>
} @else {
    <hlm-skeleton class="block h-96 rounded-xl" />
}
