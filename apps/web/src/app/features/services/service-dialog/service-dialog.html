<hlm-dialog-header>
    <h2 hlmDialogTitle class="text-xl font-semibold tracking-tight">
        {{ existing ? 'Modifier la prestation' : 'Nouvelle prestation' }}
    </h2>
</hlm-dialog-header>

<form
    id="service-form"
    class="-mx-1 grid content-start gap-5 overflow-y-auto overscroll-contain px-1 py-1"
    (ngSubmit)="save()"
>
    <div class="grid gap-2">
        <label hlmLabel for="s-label">Désignation</label>
        <input
            hlmInput
            id="s-label"
            name="label"
            required
            placeholder="Développement logiciel"
            [(ngModel)]="form.label"
        />
    </div>

    <div class="grid grid-cols-2 gap-3">
        <div class="grid gap-2">
            <label hlmLabel for="s-price">Prix HT</label>
            <div class="relative">
                <input
                    hlmInput
                    id="s-price"
                    name="unitPrice"
                    inputmode="decimal"
                    required
                    placeholder="0,00"
                    class="w-full pr-8"
                    [(ngModel)]="form.unitPrice"
                />
                <span
                    class="text-muted-foreground pointer-events-none absolute inset-y-0 right-3 grid place-items-center text-sm"
                    >€</span
                >
            </div>
        </div>
        <div class="grid gap-2">
            <label hlmLabel for="s-unit">Unité</label>
            <input
                hlmInput
                id="s-unit"
                name="unit"
                list="s-units"
                placeholder="jour, forfait…"
                [(ngModel)]="form.unit"
            />
            <datalist id="s-units">
                @for (u of units; track u) {
                    <option [value]="u"></option>
                }
            </datalist>
        </div>
    </div>

    <div class="grid gap-2">
        <label hlmLabel for="s-detail">Détail <span class="text-muted-foreground font-normal">(optionnel)</span></label>
        <input
            hlmInput
            id="s-detail"
            name="detail"
            placeholder="Maintenance et évolutions de l'application web"
            [(ngModel)]="form.detail"
        />
    </div>

    <div class="grid gap-2">
        <label hlmLabel for="s-client">Réservée à un client</label>
        <select class="select-native" id="s-client" name="clientId" [(ngModel)]="form.clientId">
            <option [ngValue]="null">Non, tous les clients</option>
            @for (c of ctx.clients; track c.id) {
                <option [ngValue]="c.id">{{ c.name }}</option>
            }
        </select>
    </div>

    <div class="grid gap-4 border-t pt-5">
        <div class="flex items-center justify-between gap-4">
            <label hlmLabel for="s-english">Version anglaise</label>
            <hlm-switch inputId="s-english" [checked]="english()" (checkedChange)="english.set($event)" />
        </div>

        @if (english()) {
            <div class="grid gap-2">
                <label hlmLabel for="s-label-en">Description</label>
                <input
                    hlmInput
                    id="s-label-en"
                    name="labelEn"
                    required
                    placeholder="Software development"
                    [(ngModel)]="form.labelEn"
                />
            </div>
            @if (form.detail) {
                <div class="grid gap-2">
                    <label hlmLabel for="s-detail-en">Details</label>
                    <input
                        hlmInput
                        id="s-detail-en"
                        name="detailEn"
                        required
                        placeholder="Web application maintenance and updates"
                        [(ngModel)]="form.detailEn"
                    />
                </div>
            }
            @if (form.unit) {
                <div class="grid gap-2">
                    <label hlmLabel for="s-unit-en">Unit</label>
                    <input
                        hlmInput
                        id="s-unit-en"
                        name="unitEn"
                        required
                        placeholder="day, fixed price…"
                        [(ngModel)]="form.unitEn"
                    />
                </div>
            }
        }
    </div>
</form>

<app-dialog-footer formId="service-form" [saving]="saving()" (dismiss)="ref.close(undefined)" />
