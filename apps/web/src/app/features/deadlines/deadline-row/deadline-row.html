@let d = deadline();
<button
    type="button"
    class="tap-row hover:bg-muted/40 flex min-w-0 flex-1 items-center gap-3 px-3.5 py-3 text-left"
    (click)="open.emit()"
>
    <app-kind-icon [kind]="d.kind" />
    <span class="min-w-0 flex-1">
        <span class="block truncate font-medium" [class.line-through]="d.done">{{ d.title }}</span>
        <span class="text-muted-foreground block truncate text-xs">
            {{ kindLabel(d) }} · {{ d.dueOn | frDate: 'short' }}
        </span>
    </span>
    <span class="shrink-0 text-right">
        <span class="block text-sm font-medium tabular-nums">{{ d.amount === null ? '—' : (d.amount | eur) }}</span>
        <span class="block text-xs" [class]="statusClass(d)">{{ status(d) }}</span>
    </span>
</button>
@if (menu(); as m) {
    <button
        hlmBtn
        variant="ghost"
        size="icon-sm"
        class="text-muted-foreground mr-2 hidden shrink-0 sm:inline-flex"
        [hlmDropdownMenuTrigger]="m"
        [hlmDropdownMenuTriggerData]="{$implicit: d}"
        align="end"
        aria-label="Actions"
    >
        <ng-icon name="lucideEllipsis" />
    </button>
}
