<section class="grid gap-4">
    <div class="grid gap-2">
        <label hlmLabel for="i-client">Client</label>
        <div class="flex gap-2">
            <select
                class="select-native flex-1"
                id="i-client"
                name="clientId"
                required
                [ngModel]="form.clientId"
                (ngModelChange)="editor.selectClient($event)"
            >
                <option value="" disabled>Choisir un client…</option>
                @for (c of editor.clients(); track c.id) {
                    <option [value]="c.id">{{ c.name }}</option>
                }
            </select>
            <button hlmBtn type="button" variant="outline" class="h-auto" (click)="newClient()">
                <ng-icon name="lucideUserPlus" /> Nouveau
            </button>
        </div>
        @if (editor.clientMissing()) {
            <p class="text-muted-foreground text-xs">
                Ce client a été supprimé du carnet : les coordonnées figées lors de l'émission seront réutilisées.
            </p>
        }
    </div>

    <div class="flex items-center justify-between gap-4">
        <label hlmLabel for="i-english">Facture aussi en anglais</label>
        <hlm-switch inputId="i-english" [checked]="form.english" (checkedChange)="form.english = $event" />
    </div>
</section>

<section class="grid gap-4 border-t pt-5">
    <h3 class="text-sm font-semibold">Facture</h3>
    <div class="grid grid-cols-2 gap-3 sm:grid-cols-3">
        <div class="col-span-2 grid gap-2 sm:col-span-1">
            <label hlmLabel for="i-number">N° de facture</label>
            <input
                hlmInput
                id="i-number"
                name="number"
                required
                [(ngModel)]="form.number"
                (ngModelChange)="editor.numberTouched = true"
            />
        </div>
        <div class="grid gap-2">
            <label hlmLabel for="i-issued">Émise le</label>
            <app-date-input
                inputId="i-issued"
                name="issuedOn"
                required
                [ngModel]="form.issuedOn"
                (ngModelChange)="editor.setIssuedOn($event)"
            />
        </div>
        <div class="grid gap-2">
            <label hlmLabel for="i-due">Paiement</label>
            <select
                class="select-native"
                id="i-due"
                name="paymentDays"
                [ngModel]="editor.paymentDays"
                (ngModelChange)="editor.setPaymentDays($event)"
            >
                @for (d of editor.paymentDayOptions(); track d) {
                    <option [ngValue]="d">{{ d === 0 ? 'À réception' : d + ' jours' }}</option>
                }
            </select>
        </div>
        @if (form.dueOn) {
            <p class="text-muted-foreground col-span-2 -mt-1 text-xs sm:col-span-3">
                À régler au plus tard le {{ form.dueOn | frDate }}.
            </p>
        }
    </div>

    <div class="grid gap-2">
        <span hlmLabel
            >Période de la prestation <span class="text-muted-foreground font-normal">(optionnelle)</span></span
        >
        <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-2">
            <app-date-input
                inputId="i-from"
                name="periodFrom"
                aria-label="Début de la prestation"
                [(ngModel)]="form.periodFrom"
            />
            <span class="text-muted-foreground text-sm">au</span>
            <app-date-input
                inputId="i-to"
                name="periodTo"
                aria-label="Fin de la prestation"
                [(ngModel)]="form.periodTo"
            />
        </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
        <div class="grid gap-2">
            <label hlmLabel for="i-currency">Devise</label>
            <select class="select-native" id="i-currency" name="currency" [(ngModel)]="form.currency">
                @for (c of currencies; track c) {
                    <option [value]="c">{{ c }}</option>
                }
            </select>
        </div>
        <div class="grid gap-2">
            <label hlmLabel for="i-vat">TVA</label>
            <div class="relative">
                <input
                    hlmInput
                    id="i-vat"
                    name="vatRate"
                    inputmode="decimal"
                    class="w-full pr-8"
                    [(ngModel)]="form.vatRate"
                />
                <span
                    class="text-muted-foreground pointer-events-none absolute inset-y-0 right-3 grid place-items-center text-sm"
                    >%</span
                >
            </div>
        </div>
    </div>
</section>
