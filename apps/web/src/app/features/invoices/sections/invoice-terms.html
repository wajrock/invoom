<section class="grid gap-4 border-t pt-5">
    <div class="flex items-center justify-between gap-4">
        <label hlmLabel for="i-default-terms" class="text-sm font-semibold"
            >Conditions et mentions légales par défaut</label
        >
        <hlm-switch
            inputId="i-default-terms"
            [checked]="!editor.customTerms()"
            (checkedChange)="editor.setCustomTerms(!$event)"
        />
    </div>

    @if (editor.customTerms()) {
        <div class="grid gap-2">
            <label hlmLabel for="i-terms-fr">Facture française</label>
            <textarea hlmTextarea id="i-terms-fr" name="termsFr" rows="5" [(ngModel)]="form.termsFr"></textarea>
        </div>
        @if (form.english) {
            <div class="grid gap-2">
                <label hlmLabel for="i-terms-en">Facture anglaise</label>
                <textarea hlmTextarea id="i-terms-en" name="termsEn" rows="5" [(ngModel)]="form.termsEn"></textarea>
            </div>
        }
    }

    <div class="flex items-center justify-between gap-4">
        <label hlmLabel for="i-defaults">
            {{
                editor.customTerms()
                    ? 'Garder ces mentions et ce délai de paiement pour les prochaines factures'
                    : 'Garder ce délai de paiement pour les prochaines factures'
            }}
        </label>
        <hlm-switch
            inputId="i-defaults"
            [checked]="editor.saveDefaults()"
            (checkedChange)="editor.saveDefaults.set($event)"
        />
    </div>
</section>
