<input
    #textInput
    hlmInput
    type="text"
    inputmode="numeric"
    autocomplete="off"
    placeholder="jj/mm/aaaa"
    maxlength="10"
    class="pr-9"
    [id]="inputId() ?? undefined"
    [attr.aria-label]="ariaLabel()"
    [forceInvalid]="invalid()"
    [disabled]="disabled()"
    [value]="text()"
    (input)="onInput($event)"
    (blur)="onBlur()"
/>
<ng-icon
    name="lucideCalendar"
    class="text-muted-foreground pointer-events-none absolute top-1/2 right-2.5 -translate-y-1/2"
    aria-hidden="true"
/>
<!--
    Native date input, transparent, laid over the calendar icon: a tap lands on it directly. iOS Safari only opens
    its picker on a real tap on the input (not from script); elsewhere the click also calls showPicker().
-->
<input
    #picker
    type="date"
    tabindex="-1"
    aria-hidden="true"
    class="absolute top-1/2 right-1 size-7 -translate-y-1/2 cursor-pointer text-base opacity-0 disabled:cursor-default"
    [disabled]="disabled()"
    [value]="value()"
    (click)="openPicker()"
    (change)="onPick($event)"
/>
