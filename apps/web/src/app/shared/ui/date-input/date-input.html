<input
    #textInput
    hlmInput
    type="text"
    inputmode="numeric"
    autocomplete="off"
    placeholder="jj/mm/aaaa"
    maxlength="10"
    class="pr-9"
    [id]="inputId() ?? undefined"
    [attr.aria-label]="ariaLabel()"
    [forceInvalid]="invalid()"
    [disabled]="disabled()"
    [value]="text()"
    (input)="onInput($event)"
    (blur)="onBlur()"
/>
<button
    type="button"
    class="text-muted-foreground hover:text-foreground absolute top-1/2 right-1 grid size-7 -translate-y-1/2 place-items-center rounded-md"
    aria-label="Ouvrir le calendrier"
    tabindex="-1"
    [disabled]="disabled()"
    (click)="openPicker()"
>
    <ng-icon name="lucideCalendar" />
</button>
<!-- Hidden native input, only used to open the calendar -->
<input
    #picker
    type="date"
    tabindex="-1"
    aria-hidden="true"
    class="pointer-events-none absolute right-0 bottom-0 size-px opacity-0"
    [value]="value()"
    (change)="onPick($event)"
/>
