# Local development services only (production uses a managed Postgres).
name: invoom

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: invoom
      POSTGRES_PASSWORD: invoom
      POSTGRES_DB: invoom
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Catches outgoing emails; inbox at http://localhost:8025
  mail:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
